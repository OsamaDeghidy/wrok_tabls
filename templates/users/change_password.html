{% extends 'base.html' %}
{% load static %}

{% block title %}تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-key me-2"></i>تغيير كلمة المرور</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_old_password" class="form-label">كلمة المرور الحالية</label>
                            <input type="password" class="form-control" id="id_old_password" name="old_password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">كلمة المرور الجديدة</label>
                            <input type="password" class="form-control" id="id_new_password1" name="new_password1" required>
                            <div class="form-text">
                                <small>يجب أن تحتوي كلمة المرور على:</small>
                                <ul class="mb-0 mt-1">
                                    <li>8 أحرف على الأقل</li>
                                    <li>حرف كبير واحد على الأقل</li>
                                    <li>رقم واحد على الأقل</li>
                                    <li>رمز خاص واحد على الأقل</li>
                                </ul>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">تأكيد كلمة المرور الجديدة</label>
                            <input type="password" class="form-control" id="id_new_password2" name="new_password2" required>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'users:edit_profile' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-right me-1"></i>العودة
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>تغيير كلمة المرور
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
